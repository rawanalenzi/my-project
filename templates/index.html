<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HoneyGate Bank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="main">
        
        <div class="navbar">
            <h2 class="logo">Bank</h2>
            <div class="menu">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </div>
            <div class="search">
                <input class="srch" type="search" placeholder="Search here...">
                <button class="btn">Search</button>
            </div>
        </div>

        <div class="content">
            <h1>Welcome to <br><span>Our Bank</span></h1>
            <p class="par">Your financial partner for a better future. Security and trust in every transaction.</p>
            <button class="cn"><a href="#">Join Now</a></button>

            <div class="form">
                <h2>Login Here</h2>
                <form method="POST" action="{{ url_for('login') }}">
                    <input type="email" name="email" placeholder="Enter Email Here" required>
                    <input type="password" name="password" placeholder="Enter Password Here" required>
                    <button type="submit" class="btnn">Login</button>
                </form>
                
                <p class="link">Don't have an account? <br> <a href="#">Sign Up</a></p>
                <p class="liw">Log in with</p>
                
                <div class="icons">
                    <a href="#"><ion-icon name="logo-facebook"></ion-icon></a>
                    <a href="#"><ion-icon name="logo-twitter"></ion-icon></a>
                    <a href="#"><ion-icon name="logo-google"></ion-icon></a>
                    <a href="#"><ion-icon name="logo-instagram"></ion-icon></a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/ionicons@5.4.0/dist/ionicons.js"></script>
<a href="/admin/config_backup" style="display:none;" aria-hidden="true">Internal Configuration Backup</a>
</body>
</html>
