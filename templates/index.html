<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeC Bank</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') 
}}">

</head>

<body class="premium-login">

<div class="bg-waves"></div>

<button class="theme-toggle" id="themeToggle">

    <svg class="icon-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
    </svg>

    <svg class="icon-moon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3c0 .28 0 .57.05.85A7 7 0 0 0 
20.15 12c.29 0 .57-.02.85-.06z"></path>
    </svg>

</button>

<div class="premium-login-shell">

    <div class="premium-brand">

        <div class="premium-logo">⌁</div>

        <h1>SeC Bank</h1>

        <p>Secure. Trusted. Connected.</p>

    </div>

    <div class="premium-login-card">

        <h2>Sign In</h2>

        {% if status_message %}
            <div class="status-message">
                {{ status_message }}
            </div>
        {% endif %}

        <form method="POST" action="/login">

            <div class="form-row">
                <input type="email" name="email" placeholder="Email 
address" required>
            </div>

            <div class="form-row">
                <input type="password" name="password" 
placeholder="Password" required>
            </div>

            <button class="btn btn-primary premium-btn" type="submit">
                Sign In
            </button>

        </form>

    </div>

</div>

<script>

const themeToggle = document.getElementById("themeToggle");

if(localStorage.getItem("theme") === "dark"){
    document.body.classList.add("dark");
}

themeToggle.addEventListener("click", () => {

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){
        localStorage.setItem("theme", "dark");
    } else {
        localStorage.setItem("theme", "light");
    }

});

</script>

</body>
</html>
