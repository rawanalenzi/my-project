<!DOCTYPE html>
<html>
<head>
    <title>Bank Internal Core - Restricted</title>
    <style>
        body { background: #000; color: #00ff00; font-family: monospace; padding: 20px; }
        #output { white-space: pre-wrap; margin-bottom: 10px; }
        #input-area { display: flex; }
        input { background: transparent; border: none; color: #00ff00; outline: none; flex: 1; font-family: monospace; }
    </style>
</head>
<body>
    <div id="output">Bank Core OS v4.1.2 - System Ready.
Type 'help' for available commands.</div>
    <div id="input-area"><span>admin@bank_server:~$ </span><input type="text" id="cmd" autofocus></div>

    <script>
        const input = document.getElementById('cmd');
        const output = document.getElementById('output');
        
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const command = this.value.toLowerCase();
                output.innerHTML += `\nadmin@bank_server:~$ ${command}`;
                
                let response = "\nCommand not found. Access denied.";
                if (command === 'ls') response = "\ndb_config.php  backup_2025.zip  users_dump.sql  private_key.pem";
                else if (command === 'help') response = "\nAvailable: ls, whoami, cat, netstat, sudo, exit";
                else if (command === 'whoami') response = "\nroot_admin";
                else if (command === 'cat db_config.php') response = "\nERROR: Database connection encrypted. Key required.";
                
                output.innerHTML += response;
                fetch('/log_command', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({command: command})}).catch(function(){});
                this.value = '';
                window.scrollTo(0, document.body.scrollHeight);
            }
        });
    </script>
</body>
</html>
